name: VoxBridge Quick Test

on:
  push:
    branches:
      - main
      - dev
      - feature/**         # optional: include your feature branches
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pyinstaller || true

      - name: Run local batch conversion test
        shell: bash
        run: |
          set -e

          echo "Preparing output directory..."
          rm -rf test_output || true
          mkdir -p test_output

          echo "Running VoxBridge CLI test on examples/impute..."
          # Adjust path if your binary or runner is in a specific folder
          python cli_entry.py batch examples/impute -o test_output -t unity --verbose > test_log.txt 2>&1 || true
          EXIT_CODE=$?

          echo "--- CLI Output Log (first 100 lines) ---"
          head -100 test_log.txt || true

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Test failed — non-zero exit code."
            tail -50 test_log.txt || true
            exit 1
          fi

          if grep -iE "error|node.js not available|fallback|no such file" test_log.txt >/dev/null 2>&1; then
            echo "❌ Found error or Node fallback message in logs."
            tail -50 test_log.txt || true
            exit 1
          fi

          echo "✅ VoxBridge test passed successfully!"
          echo "Output files generated:"
          find test_output -type f | head -50 || true