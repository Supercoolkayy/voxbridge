name: Build and Release VoxBridge

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            ext: ""
          - os: macos-latest
            target: node18-macos-x64
            ext: ""
          - os: windows-latest
            target: node18-win-x64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------
      # Node.js setup
      # -----------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node dependencies
        working-directory: node_scripts
        run: npm install --production

      - name: Build Node.js binary bundle
        shell: bash
        run: |
          # Build the bundled Node.js runner
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            bash build_node_binary.sh
          else
            bash build_node_binary.sh
          fi

          # Convert line endings for the platform
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Keep CRLF for Windows
            echo "Using CRLF line endings for Windows"
          else
            # Convert to LF for Linux/Mac
            sed -i 's/\r$//' build/node_binary/voxbridge_node.js
          fi

      # -----------------------
      # Python setup
      # -----------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ----------------- CLI BUILD -----------------
      - name: Build CLI Executable with PyInstaller
        shell: bash
        run: |
          # Determine separator for add-data based on OS
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            SEP=";"
          else
            SEP=":"
          fi

          pyinstaller --clean -y \
            --distpath dist \
            --workpath build \
            --onefile \
            --console \
            --name voxbridge${{ matrix.ext }} \
            --add-data "voxbridge${SEP}voxbridge" \
            --add-data "build/node_binary${SEP}build/node_binary" \
            --add-data "node_scripts${SEP}node_scripts" \
            --hidden-import voxbridge.orchestrated_converter \
            --hidden-import voxbridge.pipeline_runner \
            --hidden-import voxbridge.cross_platform \
            --hidden-import voxbridge.error_handler \
            --hidden-import voxbridge.utils.paths \
            --hidden-import voxbridge.utils.detect \
            cli_entry.py

      # ----------------- GUI BUILD -----------------
      - name: Build GUI Executable with PyInstaller
        shell: bash
        run: |
          # Determine separator for add-data based on OS
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            SEP=";"
          else
            SEP=":"
          fi

          pyinstaller --clean -y \
            --distpath dist \
            --workpath build_gui \
            --onefile \
            --windowed \
            --name voxbridge-gui${{ matrix.ext }} \
            --add-data "voxbridge${SEP}voxbridge" \
            --add-data "build/node_binary${SEP}build/node_binary" \
            --add-data "node_scripts${SEP}node_scripts" \
            --hidden-import voxbridge.orchestrated_converter \
            --hidden-import voxbridge.pipeline_runner \
            --hidden-import voxbridge.cross_platform \
            --hidden-import voxbridge.error_handler \
            --hidden-import voxbridge.utils.paths \
            --hidden-import voxbridge.utils.detect \
            --hidden-import voxbridge.gui.app \
            gui_entry.py

      # ----------------- PACKAGE -----------------
      - name: Create release package
        shell: bash
        run: |
          # Create release directory structure
          mkdir -p release/voxbridge

          # Copy executables
          cp dist/voxbridge${{ matrix.ext }} release/voxbridge/
          cp dist/voxbridge-gui${{ matrix.ext }} release/voxbridge/

          # Copy node_scripts with dependencies
          cp -r node_scripts release/voxbridge/
          cp -r build/node_binary release/voxbridge/

          # Copy documentation
          cp README.md release/voxbridge/
          cp LICENSE release/voxbridge/
          cp -r docs release/voxbridge/ || true
          cp -r examples release/voxbridge/ || true

          # Create archive with platform-specific naming
          cd release
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            tar -czf voxbridge-linux-x64.tar.gz voxbridge/
            mv voxbridge-linux-x64.tar.gz ../
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            tar -czf voxbridge-macos-x64.tar.gz voxbridge/
            mv voxbridge-macos-x64.tar.gz ../
          else
            7z a -tzip voxbridge-windows-x64.zip voxbridge/ || zip -r voxbridge-windows-x64.zip voxbridge/
            mv voxbridge-windows-x64.zip ../
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxbridge-${{ matrix.target }}
          path: |
            voxbridge-*.tar.gz
            voxbridge-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded files
        run: ls -R ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find ./artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find ./artifacts -name "*.zip" -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## VoxBridge Release

            Complete standalone executables for Linux, macOS, and Windows.
            Includes bundled Node.js processing - no additional dependencies required!

            ### Downloads:
            - **Linux**: `voxbridge-linux-x64.tar.gz`
            - **macOS**: `voxbridge-macos-x64.tar.gz`  
            - **Windows**: `voxbridge-windows-x64.zip`

            ### Features:
            - Single executable with all dependencies
            - Node.js processing bundled
            - CLI and GUI versions included
            - Full texture support
            - Animation preservation
            - Cross-platform compatible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
