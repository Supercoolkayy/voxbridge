name: Publish VoxBridge

on:
  push:
    tags:
      - "v*.."

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            ext: ""
          - os: macos-latest
            target: node18-macos-x64
            ext: ""
          - os: windows-latest
            target: node18-win-x64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------
      # Node.js setup
      # -----------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node deps
        run: npm install

      - name: Build Node runner (wrapper approach)
        run: |
          # Create Node.js wrapper instead of using pkg (avoids download issues)
          cat > node_runner${{ matrix.ext }} << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          NODE_SCRIPTS_DIR="$SCRIPT_DIR/node_scripts"
          if [ ! -d "$NODE_SCRIPTS_DIR" ]; then
            echo "❌ Node.js scripts directory not found: $NODE_SCRIPTS_DIR"
            exit 1
          fi
          if ! command -v node &> /dev/null; then
            echo "❌ Node.js not found. Please install Node.js 18+"
            exit 1
          fi
          cd "$NODE_SCRIPTS_DIR"
          node index.js "$@"
          EOF
          chmod +x node_runner${{ matrix.ext }}

      # -----------------------
      # Python setup
      # -----------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pip install -r requirements-freeze.txt
          else
            pip install -r requirements.txt
          fi
          pip install pyinstaller

      # ----------------- CLI BUILD -----------------
      - name: Build CLI Executable
        run: |
          pyinstaller --clean -y \
            --distpath dist_${{ matrix.os }} \
            --workpath build_${{ matrix.os }} \
            --onefile \
            --console \
            --name voxbridge \
            --add-data "voxbridge;voxbridge" \
            --add-data "node_scripts;node_scripts" \
            --add-binary "node_runner${{ matrix.ext }}:." \
            --hidden-import voxbridge.orchestrated_converter \
            --hidden-import voxbridge.utils.paths \
            cli_entry.py

      # ----------------- GUI BUILD -----------------
      - name: Build GUI Executable
        run: |
          pyinstaller --clean -y \
            --distpath dist_${{ matrix.os }} \
            --workpath build_${{ matrix.os }} \
            --onefile \
            --windowed \
            --name voxbridge-gui \
            --add-data "voxbridge;voxbridge" \
            --add-data "node_scripts;node_scripts" \
            --add-binary "node_runner${{ matrix.ext }}:." \
            --hidden-import voxbridge.orchestrated_converter \
            --hidden-import voxbridge.utils.paths \
            gui_entry.py

      # ----------------- PACKAGE -----------------
      - name: Package artifacts
        run: |
          cd dist_${{ matrix.os }}
          zip -r ../voxbridge-${{ matrix.os }}.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxbridge-${{ matrix.os }}
          path: voxbridge-${{ matrix.os }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release

      - name: List downloaded files
        run: ls -R ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release//*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}