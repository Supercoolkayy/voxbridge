name: Build and Release VoxBridge

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            ext: ""
          - os: macos-latest
            target: node18-macos-x64
            ext: ""
          - os: windows-latest
            target: node18-win-x64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------
      # Node.js setup (for build-time tasks & pkg-fetch)
      # -----------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node dependencies
        working-directory: node_scripts
        shell: bash
        run: |
          # Prevent interactive prompts on Windows
          npm config set fund false
          npm config set audit false
          npm install --production --no-optional --no-audit --no-fund
        timeout-minutes: 15

      # -----------------------
      # Build standalone Node.js binary with all dependencies
      # This creates a completely standalone Node.js executable
      # -----------------------
      - name: Build standalone Node.js binary
        shell: bash
        run: |
          set -e
          mkdir -p build/node_binary
          
          echo "Building standalone Node.js binary for platform: ${{ matrix.os }}"
          
          # Install pkg globally for building standalone executables
          npm install -g pkg
          
          # Build the standalone Node.js binary with all dependencies
          cd node_scripts
          
          # Install all dependencies
          npm install
          
          # Build standalone executable for current platform
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            npx pkg . --targets node18-win-x64 --output ../build/node_binary/voxbridge-node.exe
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npx pkg . --targets node18-macos-x64 --output ../build/node_binary/voxbridge-node
          else
            npx pkg . --targets node18-linux-x64 --output ../build/node_binary/voxbridge-node
          fi
          
          # Also copy the Node.js runner script to the build directory for bundling
          cp simple_processor.js ../build/node_binary/
          cp process_complex.js ../build/node_binary/
          cp validate.js ../build/node_binary/
          
          cd ..
          
          # Make executable (skip on Windows)
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x build/node_binary/voxbridge-node
          fi
          
          echo "Standalone Node.js binary built. Files in build/node_binary:"
          ls -la build/node_binary

      # -----------------------
      # Python setup
      # -----------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        timeout-minutes: 10

      - name: Verify build environment
        shell: bash
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Node (system) version: $(node --version || echo 'no system node')"
          echo "Python version: $(python --version)"
          echo "Files in current directory:"
          ls -la
          echo "Node scripts directory:"
          ls -la node_scripts/ || echo "node_scripts not found"
          echo "Build node binary dir contents:"
          ls -la build/node_binary || true

      # ----------------- CLI BUILD -----------------
      - name: Build CLI Executable with PyInstaller
        shell: bash
        timeout-minutes: 30
        run: |
          # Determine separator for add-data based on OS
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            SEP=";"
          else
            SEP=":"
          fi

          echo "Building CLI executable for ${{ matrix.os }}"
          echo "Using separator: $SEP"

          pyinstaller --clean -y \
            --distpath dist \
            --workpath build \
            --onefile \
            --console \
            --name voxbridge${{ matrix.ext }} \
            --add-data "voxbridge${SEP}voxbridge" \
            --add-data "build/node_binary${SEP}build/node_binary" \
            --add-data "node_scripts${SEP}node_scripts" \
            --hidden-import voxbridge \
            --hidden-import voxbridge.orchestrated_converter \
            --hidden-import voxbridge.pipeline_runner \
            --hidden-import voxbridge.cross_platform \
            --hidden-import voxbridge.error_handler \
            --hidden-import voxbridge.utils \
            --hidden-import voxbridge.utils.paths \
            --hidden-import voxbridge.utils.detect \
            --hidden-import voxbridge.texture_optimizer \
            --hidden-import voxbridge.platform_profiles \
            --hidden-import voxbridge.converter \
            --hidden-import voxbridge.cli \
            --exclude-module matplotlib \
            --exclude-module pandas \
            --exclude-module jupyter \
            --exclude-module IPython \
            cli_entry.py

          echo "CLI build completed"
          ls -la dist/ || true

      # ----------------- GUI BUILD -----------------
      - name: Build GUI Executable with PyInstaller
        shell: bash
        timeout-minutes: 30
        run: |
          # Determine separator for add-data based on OS
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            SEP=";"
          else
            SEP=":"
          fi

          echo "Building GUI executable for ${{ matrix.os }}"

          pyinstaller --clean -y \
            --distpath dist \
            --workpath build_gui \
            --onefile \
            --windowed \
            --name voxbridge-gui${{ matrix.ext }} \
            --add-data "voxbridge${SEP}voxbridge" \
            --add-data "build/node_binary${SEP}build/node_binary" \
            --add-data "node_scripts${SEP}node_scripts" \
            --hidden-import voxbridge \
            --hidden-import voxbridge.orchestrated_converter \
            --hidden-import voxbridge.pipeline_runner \
            --hidden-import voxbridge.cross_platform \
            --hidden-import voxbridge.error_handler \
            --hidden-import voxbridge.utils \
            --hidden-import voxbridge.utils.paths \
            --hidden-import voxbridge.utils.detect \
            --hidden-import voxbridge.texture_optimizer \
            --hidden-import voxbridge.platform_profiles \
            --hidden-import voxbridge.converter \
            --hidden-import voxbridge.gui \
            --hidden-import voxbridge.gui.app \
            --exclude-module matplotlib \
            --exclude-module pandas \
            --exclude-module jupyter \
            --exclude-module IPython \
            gui_entry.py

          echo "GUI build completed"
          ls -la dist/ || true

      # ----------------- PACKAGE -----------------
      - name: Create release package
        shell: bash
        timeout-minutes: 10
        run: |
          # Create release directory structure
          mkdir -p release/voxbridge

          echo "Copying files to release package..."

          # Copy ONLY the two main executables (clean package)
          cp dist/voxbridge${{ matrix.ext }} release/voxbridge/ || true
          cp dist/voxbridge-gui${{ matrix.ext }} release/voxbridge/ || true

          echo "Clean package created with only executables:"
          ls -la release/voxbridge/

          # List what we have
          echo "Package contents (top 200 files):"
          find release/voxbridge -type f 2>/dev/null | head -200 || echo "No files found or find command failed"

          # Create archive with platform-specific naming
          cd release
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            tar -czf voxbridge-linux-x64.tar.gz voxbridge/
            mv voxbridge-linux-x64.tar.gz ../
            echo "Created voxbridge-linux-x64.tar.gz"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            tar -czf voxbridge-macos-x64.tar.gz voxbridge/
            mv voxbridge-macos-x64.tar.gz ../
            echo "Created voxbridge-macos-x64.tar.gz"
          else
            # Use built-in zip command on Windows runner via PowerShell
            powershell Compress-Archive -Path voxbridge -DestinationPath ../voxbridge-windows-x64.zip -Force
            echo "Created voxbridge-windows-x64.zip"
          fi

          # Show final files
          ls -la ../voxbridge-*.* || echo "No archive files created"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxbridge-${{ matrix.os }}
          path: |
            voxbridge-*.tar.gz
            voxbridge-*.zip
          if-no-files-found: error

      - name: List final artifacts
        shell: bash
        run: |
          echo "Final artifacts created on this runner:"
          ls -la voxbridge-*.* || echo "No artifacts found"

  # -----------------------
  # TEST job (runs on ubuntu-latest)
  # This extracts the Linux artifact, runs the packaged CLI against examples/input,
  # and ensures there is no 'Node.js not available' fallback in the logs.
  # -----------------------
  
  # -----------------------
  # Release job - only runs on tag if build+test succeeded
  # -----------------------
  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded files
        run: ls -R ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find ./artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find ./artifacts -name "*.zip" -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## VoxBridge Release

            Complete standalone executables for Linux, macOS, and Windows.
            Includes bundled Node.js processing — no additional dependencies required!

            ### Downloads:
            - **Linux**: `voxbridge-linux-x64.tar.gz`
            - **macOS**: `voxbridge-macos-x64.tar.gz`  
            - **Windows**: `voxbridge-windows-x64.zip`

            ### Features:
            - Single executable with all dependencies
            - Node.js processing bundled
            - CLI and GUI versions included
            - Full texture support
            - Animation preservation
            - Cross-platform compatible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}